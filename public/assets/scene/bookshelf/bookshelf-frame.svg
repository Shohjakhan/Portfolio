<svg width="150" height="320" viewBox="0 0 150 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wooden bookshelf frame placeholder">
  <defs>
    <linearGradient id="bsWood" x1="0" y1="0" x2="150" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a4028"/>
      <stop offset="1" stop-color="#2f2015"/>
    </linearGradient>
    <linearGradient id="bsShelfShade" x1="0" y1="0" x2="0" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- outer carcass -->
  <rect x="4" y="4" width="142" height="312" rx="6" fill="url(#bsWood)" stroke="#1c130c" stroke-width="3"/>

  <!-- shelf compartments -->
  <g stroke="#1c130c" stroke-width="3">
    <rect x="12" y="12" width="126" height="88" fill="#3c2c1e"/>
    <rect x="12" y="112" width="126" height="88" fill="#3c2c1e"/>
    <rect x="12" y="212" width="126" height="96" fill="#3c2c1e"/>
  </g>

  <!-- under-shelf shadow for depth -->
  <rect x="12" y="100" width="126" height="12" fill="url(#bsShelfShade)"/>
  <rect x="12" y="200" width="126" height="12" fill="url(#bsShelfShade)"/>

  <!-- carved top cornice -->
  <rect x="0" y="0" width="150" height="10" rx="3" fill="#42301f" stroke="#1c130c" stroke-width="2"/>
</svg>
