<svg width="46" height="100" viewBox="0 0 46 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gallery classical bust statue placeholder">
  <defs>
    <linearGradient id="gbMarble" x1="0" y1="0" x2="0" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2ede2"/>
      <stop offset="1" stop-color="#c9c0ac"/>
    </linearGradient>
    <linearGradient id="gbPedestal" x1="0" y1="60" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8d0bd"/>
      <stop offset="1" stop-color="#a89e88"/>
    </linearGradient>
  </defs>
  <!-- pedestal -->
  <path d="M8 68 L38 68 L41 100 L5 100 Z" fill="url(#gbPedestal)" stroke="#5a5240" stroke-width="1.5"/>
  <rect x="6" y="62" width="34" height="8" rx="1" fill="#e4dcc8" stroke="#5a5240" stroke-width="1.5"/>
  <!-- shoulders/chest -->
  <path d="M11 62 C11 46 15 40 23 40 C31 40 35 46 35 62 Z" fill="url(#gbMarble)" stroke="#8a806c" stroke-width="1.2"/>
  <!-- neck -->
  <rect x="19" y="30" width="8" height="12" fill="url(#gbMarble)"/>
  <!-- head -->
  <ellipse cx="23" cy="22" rx="10" ry="12" fill="url(#gbMarble)" stroke="#8a806c" stroke-width="1.2"/>
  <!-- simple laurel suggestion -->
  <path d="M14 16 C12 12 13 8 17 6" stroke="#7a8a5f" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M32 16 C34 12 33 8 29 6" stroke="#7a8a5f" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8"/>
</svg>
